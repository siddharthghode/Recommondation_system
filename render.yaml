services:
  - type: web
    name: library-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: POSTGRES_DB
        fromDatabase:
          name: library-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: library-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: library-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: library-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: library-db
          property: port
      - key: ALLOWED_HOSTS
        value: library-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://library-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://library-backend.onrender.com,https://library-frontend.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: library-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://library-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: library-db
    plan: free
    databaseName: library_db
    user: library_user
