name: Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches: [ main, deploy ]
  pull_request:
    branches: [ main, deploy ]

permissions:
  contents: read
  packages: write

jobs:
  # ── 1. Security Scan ────────────────────────────────────────────────────────
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Bandit Security Scanner
        run: pip install bandit

      - name: Run Bandit AST Security Scan (Backend)
        run: |
          bandit -r backend/accounts backend/books backend/borrows backend/analytics backend/messaging backend/book_recommondation -ll --skip B310,B611

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Audit Scan
        working-directory: ./frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  # ── 2. Backend Pytest & Coverage ────────────────────────────────────────────
  backend-tests:
    name: Backend Pytest & Coverage Gate
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: development
      DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-test-secret-key-for-automated-pipeline"
      DJANGO_TESTING: "true"
      REDIS_URL: "redis://127.0.0.1:6379/1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Integrity Check
        working-directory: ./backend
        run: |
          python manage.py check

      - name: Check Pending Database Migrations
        working-directory: ./backend
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Pytest with Coverage Gate (>=80%)
        run: |
          pytest --cov=backend/accounts --cov=backend/books --cov=backend/borrows --cov=backend/analytics --cov=backend/messaging --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7

  # ── 3. Frontend Lint & Build ────────────────────────────────────────────────
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Verify Vite Production Build
        working-directory: ./frontend
        run: npm run build

  # ── 4. Docker Build & Push to GHCR ──────────────────────────────────────────
  docker-build:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-check, security-scan]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Format GHCR Image Names
        run: |
          IMAGE_BACKEND="ghcr.io/${{ github.repository }}/backend"
          IMAGE_FRONTEND="ghcr.io/${{ github.repository }}/frontend"
          echo "IMAGE_BACKEND=${IMAGE_BACKEND,,}" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=${IMAGE_FRONTEND,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy') }}
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy') }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Deploy Stage ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy')

    steps:
      - name: Trigger Webhook / Render Deploy
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          DEPLOYED=false
          if [ -n "$RENDER_DEPLOY_HOOK_BACKEND" ]; then
            echo "Triggering Render Backend deploy hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BACKEND"
            echo "Backend deployment triggered successfully."
            DEPLOYED=true
          fi
          if [ -n "$RENDER_DEPLOY_HOOK_FRONTEND" ]; then
            echo "Triggering Render Frontend deploy hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_FRONTEND"
            echo "Frontend deployment triggered successfully."
            DEPLOYED=true
          fi
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Triggering generic deploy webhook..."
            curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
            echo "Deploy webhook triggered successfully."
            DEPLOYED=true
          fi
          if [ "$DEPLOYED" = false ]; then
            echo "ℹ️ No deployment webhook secrets configured (RENDER_DEPLOY_HOOK_BACKEND / DEPLOY_WEBHOOK_URL)."
            echo "Images are pushed to GHCR and ready for deployment."
          fi
