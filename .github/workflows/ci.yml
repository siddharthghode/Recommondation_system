name: Continuous Integration (CI)

on:
  push:
    branches: [ main, deploy ]
  pull_request:
    branches: [ main, deploy ]

jobs:
  backend-tests:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest

    env:
      DJANGO_ENV: development
      DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-test-secret-key-for-automated-pipeline"
      DJANGO_TESTING: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Integrity Check
        working-directory: ./backend
        run: |
          python manage.py check

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=backend/accounts --cov=backend/books --cov=backend/borrows --cov=backend/analytics --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Verify Vite Production Build
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-check]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: library-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: library-frontend:test
